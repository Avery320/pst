name: Build desktop installers and publish release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize releases, including manual and tag-triggered runs for the same version.
concurrency:
  group: pst-desktop-release
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_INCREMENTAL: '0'

jobs:
  prepare:
    name: Validate release version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test release and license validation
        run: node --test --test-isolation=none --test-reporter=spec scripts/desktop-release.test.mjs scripts/desktop-licenses.test.mjs
      - name: Check versions, lockfiles, and trigger
        id: metadata
        run: node scripts/desktop-release.mjs validate
      - name: Refuse conflicting tags and published versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/desktop-release.mjs preflight

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            native-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            license-targets: --target x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-universal
            runner: macos-15
            target: universal-apple-darwin
            native-target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            license-targets: --target aarch64-apple-darwin --target x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
    env:
      PST_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PST_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify checked-out release metadata
        run: node scripts/desktop-release.mjs validate
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test frontend and date interactions
        run: npm test
      - name: Install pinned Rust toolchain and native targets
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" ${{ matrix.rust-targets }}
          rustc --version
          cargo --version
      - name: Fetch locked native dependencies
        env:
          PST_RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          for target in $PST_RUST_TARGETS; do
            cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "$target"
          done
      - name: Collect native dependency license notices
        run: node scripts/desktop-licenses.mjs ${{ matrix.license-targets }} --features custom-protocol
      # Tauri's beforeBuildCommand runs npm run build, including TypeScript checks.
      # Cargo's --locked is forwarded after the second -- (the first belongs to npm).
      - name: Build native application and installer
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installers, covered sources, and SHA-256 checksums
        run: node scripts/desktop-release.mjs collect ${{ matrix.platform }}
      - name: Verify both macOS architectures and the ad-hoc signature
        if: matrix.platform == 'macos-universal'
        run: |
          lipo -verify_arch arm64 x86_64 src-tauri/target/universal-apple-darwin/release/pst
          codesign --verify --deep --strict src-tauri/target/universal-apple-darwin/release/bundle/macos/pst.app
      - name: Test native file handling
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.native-target }} --features custom-protocol --lib
      - name: Upload built installers, notices, covered sources, and checksums
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pst-desktop-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: desktop-artifacts/*
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish complete desktop release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PST_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PST_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download installers from both successful jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pst-desktop-${{ needs.prepare.outputs.version }}-*
          path: desktop-artifacts
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/desktop-release.mjs publish
